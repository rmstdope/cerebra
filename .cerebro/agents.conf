# What each agent runs on: which tool, which model, how hard it thinks. Written by
# .cerebro/cerebro/scripts/install and edited by hand; .cerebro/cerebro/agents.conf.example is the shape.
# The most specific line wins whole: the agent's own name, then its role, then `default'.

default       tool=copilot  model=claude-opus-5.5  effort=low
orchestrator  tool=copilot  model=claude-opus-5.5  effort=medium
producer      tool=copilot  model=claude-opus-5.5  effort=medium

# Every other role runs on the default line. Uncomment one to give that role its own settings.
#ux            tool=copilot  model=gpt-5.6-terra  effort=medium
#orchestrator  tool=copilot  model=gpt-5.6-terra  effort=medium
#verifier      tool=copilot  model=gpt-5.6-terra  effort=medium
#reviewer      tool=copilot  model=gpt-5.6-terra  effort=medium
#user-feedback tool=copilot  model=gpt-5.6-terra  effort=medium
#architect     tool=copilot  model=gpt-5.6-terra  effort=medium
