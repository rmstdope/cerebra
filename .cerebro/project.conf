# Project facts for the classic Cerebro fleet building this application.
# Values run to the end of the line; # begins a comment.
project_name Cerebra
default_branch main
audience_noun navigator
app_paths ^(packages/(shared|backend|runner|ui)/|images/)

# Foundations must implement these commands; no application workspace exists yet.
# check covers lint, format, typecheck, build, unit and real-Postgres tests.
# The same gate runs locally and in CI on ubuntu-latest.
gate_fast pnpm run check
gate_full pnpm run check
install pnpm install --frozen-lockfile

# install_shell absent: installation uses one command.
# prewarm absent: no separate prewarming command has been agreed.
# rust_paths absent: this application uses TypeScript, not Rust.
# disk_floor_gb and disk_floor_non_rust_gb absent: no thresholds agreed.
# reclaim_dirs and cargo_reclaim_packages absent: no cleanup policy agreed.

# launch_targets, launch_web and launch_web_port absent: no runnable UI yet.
# The first runnable application increment must declare its launch command.
# verification absent: this is a visible application; verification is not disabled.
# verification_skill and fixtures_doc absent: neither exists yet.
# port_base, port_block_size and port_env absent: serving ports are not settled.

# navigator_gates absent: classic producers use independent review and merge
# without additional navigator checkpoints. Product checkpoints are separate.
# role_start_spacing_producer absent: use the fleet's default spacing.
# planner_buffer_multiple absent: use the fleet's default buffer.
# retro_dir absent: no retrospective directory has been established.
# commit_ref_pattern absent: use the fleet's bead commit convention.
# non_delivery_commit_pattern absent: no project-specific exclusion agreed.
# merged_check absent: use the fleet's default delivery detection.
